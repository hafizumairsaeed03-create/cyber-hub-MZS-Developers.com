<!DOCTYPE html>
<html>
<head>
    <title>Initialization</title>
    <link rel="stylesheet" type="text/css" href="initialization.css">
</head>
<body>

    <!-- Background Video -->
    <video id="bg-video" autoplay muted loop playsinline preload="auto" class="bg-video">
        <source src="wr.mp4" type="video/mp4">
    </video>

    <!-- Welcome Voice Audio -->
    <audio id="welcome-audio" preload="auto">
        <source src="welcome.mp3" type="audio/mpeg">
    </audio>

    <script>
        const video = document.getElementById('bg-video');
        const audio = document.getElementById('welcome-audio');

        let isPlayed = false;

        function startMedia() {
            if (isPlayed) return;
            isPlayed = true;

            // Video & Audio Play
            video.play().catch(e => console.log("Video error:", e));
            audio.play().catch(e => console.log("Audio error:", e));
        }

        // 1. Agar video fast load ho jaye to foran chala do
        video.addEventListener('loadeddata', startMedia);

        // 2. FALLBACK: Agar slow net ki waja se video 1.5 second mein load na ho, tab bhi zabardasti start kar do
        setTimeout(startMedia, 1500);

        // User click fallback (Agar browser autoplay block kar de)
        document.addEventListener('click', startMedia, { once: true });

        // 25 Seconds Redirection
        setTimeout(function() {
            window.location.href = "home.html";
        }, 25000);
    </script>

</body>
</html>
