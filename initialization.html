<!DOCTYPE html>
<html>
<head>
    <title>Initialization
    </title>
    <!-- CSS Files Link -->
    <link rel="stylesheet" type="text/css" href="initialization.css">
    
</head>
<body>

    <!-- Background Video -->
    <video autoplay muted loop class="bg-video">
        <source src="wr.mp4" type="video/mp4">
    </video>

    <!-- Welcome Voice Audio -->
    <audio id="welcome-audio" autoplay>
        <source src="welcome.mp3" type="audio/mpeg">
    </audio>

    <!-- 25 Seconds Redirection Script -->
    <script>
        // Page load hote hi voice play karne ke liye
        window.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('welcome-audio');
            audio.play().catch(error => {
                console.log("Autoplay block hua, user interaction chahiye:", error);
            });
        });

        // 25 seconds (25000ms) baad next page par jane ke liye
        setTimeout(function() {
            window.location.href = "home.html"; // Apne next page ka naam likhein
        }, 25000);
    </script>

</body>
</html>
