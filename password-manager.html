<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MZ Secure Vault Password Manager - MZ 10-Vault Edition</title>
  <style>
    :root {
      --bg-color: #020617;
      --card-bg: #050b18;
      --border-color: #00f0ff;
      --accent-color: #00f0ff;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --badge-bg: #0a2540;
      --badge-text: #00f0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 10%, #081b33 0%, #020617 70%);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    /* Top Banner Header */
    .top-banner {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 25px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .badge {
      display: inline-block;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .banner-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0,240,255,0.4);
    }

    .banner-subtitle {
      font-size: 13px;
      color: var(--text-sub);
    }

    .mz-header-logo {
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, #0088cc, #00f0ff);
      color: #020617;
      font-weight: 900;
      font-size: 26px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
      border: 2px solid #ffffff;
      letter-spacing: 1px;
    }

    .global-voice-bar {
      margin-bottom: 30px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-global {
      background: #0a2540;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn-global:hover {
      background: #00f0ff;
      color: #020617;
      box-shadow: 0 0 15px rgba(0,240,255,0.8);
    }

    /* Vault Instance Box */
    .vault-instance-box {
      background: rgba(5, 11, 24, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 40px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
    }

    .instance-header {
      font-size: 16px;
      font-weight: 800;
      color: #00f0ff;
      margin-bottom: 15px;
      border-bottom: 1px solid #0a2540;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .instance-controls {
      display: flex;
      gap: 8px;
    }

    .btn-mini {
      background: #0a2540;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }
    .btn-mini:hover {
      background: #00f0ff;
      color: #020617;
    }

    .btn-mini-demo {
      background: #059669;
      color: #fff;
      border: none;
    }
    .btn-mini-demo:hover {
      background: #10b981;
      color: #fff;
    }

    /* Dashboard Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 12px;
      border-bottom: 1px solid #0a2540;
      padding-bottom: 6px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 4px;
      font-weight: 600;
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      background: #020617;
      border: 1px solid #11223f;
      border-radius: 6px;
      padding: 9px 12px;
      color: #00f0ff;
      font-family: monospace;
      font-size: 12px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #0088cc, #00f0ff);
      color: #020617;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      transition: all 0.2s;
      margin-top: 4px;
    }
    .btn:hover {
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
    }

    /* Vault Table */
    .vault-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }

    .vault-table th, .vault-table td {
      padding: 10px;
      border-bottom: 1px solid #0a2540;
    }

    .vault-table th {
      color: var(--text-sub);
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
    }

    .vault-table td {
      color: #fff;
    }

    .group-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      background: #0a2540;
      color: #00f0ff;
      border: 1px solid rgba(0,240,255,0.3);
      margin-bottom: 3px;
    }

    .pass-masked {
      font-family: monospace;
      color: #00f0ff;
    }

    .action-btn {
      background: #0a2540;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
    }
    .action-btn:hover {
      background: #00f0ff;
      color: #020617;
    }
  </style>
</head>
<body>

  <main class="w-full min-h-screen flex flex-col justify-start py-8 px-4 lg:px-8">
    <div class="w-full max-w-[1450px] mx-auto cyber-glass-glow rounded-2xl p-5 md:p-8 relative overflow-hidden">
        
        <!-- Top Decorative Ambient Glows -->
        <div class="absolute -top-20 -right-20 w-44 h-44 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -left-20 w-44 h-44 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Yahan se aapka asal container wala content shuru hoga -->
        <div class="container" style="max-width: 100%; margin: 0; padding: 0; background: transparent; box-shadow: none;">
            
            <!-- Header with MZ Logo -->
            <div class="top-banner">
                <div>
                    <span class="badge">MZ Security Tool</span>
                    <h1 class="banner-title">MZ Secure Vault Password Manager - 10 Instances Edition</h1>
                    <p class="banner-subtitle">10 Independent Zero-knowledge encrypted password vaults running simultaneously.</p>
                </div>
                <div class="mz-header-logo">MZ</div>
            </div>

            <!-- Global Voice Bar with multi-fallback -->
            <div class="global-voice-bar">
                <button class="btn-global" onclick="speakUrduIntro()">🔊 Play Urdu Speech</button>
                <button class="btn-global" style="background:#059669; border-color:#10b981; color:#fff;" onclick="playChimeSound()">🔔 Test Audio Chime</button>
            </div>

            <!-- Container for 10 Vaults (Generated via JavaScript) -->
            <div id="tenVaultsContainer"></div>

        </div> <!-- End of container wrapper -->

    </div>
</main>

  <script>
    // Global Audio Context handler for continuous keystrokes
    let sharedAudioCtx = null;

    function getAudioContext() {
      if (!sharedAudioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          sharedAudioCtx = new AudioContextClass();
        }
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    }

    // Reliable Keypress & Action Beep Sound Generator
    function playSound(freq = 700) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq + 250, ctx.currentTime + 0.08);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.09);
        
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      } catch(e) {}
    }

    // Rich Chime sound for testing audio
    function playChimeSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((note, index) => {
          setTimeout(() => {
            playSound(note);
          }, index * 100);
        });
      } catch(e) {}
    }

    // Urdu Voice Assistant using Speech Synthesis API
    function speakUrduIntro() {
      try {
        // Unlock AudioContext first on user click
        getAudioContext();

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const text = "Yeh Secure Vault Password Manager ka das instances wala edition hai. Aap har section mein alag alag live auto typing demo chala sakte hain.";
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ur-PK'; // Urdu locale
          utterance.rate = 0.95;
          
          // Fallback if Urdu voice is missing in system
          utterance.onerror = function() {
            utterance.lang = 'hi-IN';
            window.speechSynthesis.speak(utterance);
          };

          window.speechSynthesis.speak(utterance);
        } else {
          alert("Speech synthesis is not supported in your browser.");
        }
      } catch(e) {
        alert("Audio speech blocked or unsupported.");
      }
    }

    // Vault Data Store for 10 instances
    const vaultsData = {};

    // Generate 10 Vault Instances dynamically
    function buildTenVaults() {
      const container = document.getElementById('tenVaultsContainer');
      let htmlContent = '';

      for (let i = 1; i <= 10; i++) {
        vaultsData[i] = [];
        htmlContent += `
          <div class="vault-instance-box" id="box_${i}">
            <div class="instance-header">
              <span>🔒 Secure Vault Instance #${i} (MZ Edition)</span>
              <div class="instance-controls">
                <button class="btn-mini btn-mini-demo" onclick="startAutoTypeDemo(${i})">⚡ Auto-Type Demo #${i}</button>
              </div>
            </div>

            <div class="dashboard-grid">
              <!-- Left Column -->
              <div>
                <div class="card">
                  <div class="card-title">Add Credential #${i}</div>
                  <div class="form-group">
                    <label>Password Group</label>
                    <select id="group_${i}">
                      <option value="Social Media">🌐 Social Media</option>
                      <option value="Banking & Finance">💳 Banking & Finance</option>
                      <option value="Cloud Infrastructure">☁️ Cloud Infrastructure</option>
                      <option value="Developer Tools">💻 Developer Tools</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Service / Platform</label>
                    <input type="text" id="service_${i}" placeholder="e.g. GitHub, Gmail...">
                  </div>
                  <div class="form-group">
                    <label>Username / Email</label>
                    <input type="text" id="user_${i}" placeholder="user@mz-domain.com">
                  </div>
                  <div class="form-group">
                    <label>Secure Password</label>
                    <input type="password" id="pass_${i}" placeholder="Enter password...">
                  </div>
                  <button class="btn" onclick="addCredential(${i})">🔒 Save to Vault #${i}</button>
                </div>

                <div class="card" style="margin-bottom:0;">
                  <div class="card-title">Password Generator #${i}</div>
                  <button class="btn" style="background: #0a2540; color: #00f0ff; border: 1px solid #00f0ff;" onclick="generatePassword(${i})">⚡ Generate Strong Key</button>
                  <input type="text" id="gen_${i}" readonly style="margin-top: 8px; text-align:center;" placeholder="Click generate...">
                </div>
              </div>

              <!-- Right Column -->
              <div>
                <div class="card" style="margin-bottom:0; height: 100%;">
                  <div class="card-title" style="display:flex; justify-content:space-between;">
                    <span>Stored Entries</span>
                    <span style="font-size: 11px; color: #00f0ff;" id="count_${i}">0 items secured</span>
                  </div>
                  <div style="overflow-x: auto;">
                    <table class="vault-table">
                      <thead>
                        <tr>
                          <th>Group & Service</th>
                          <th>Username</th>
                          <th>Encrypted Password</th>
                          <th>Action</th>
                        </tr>
                      </thead>
                      <tbody id="tbody_${i}">
                        <tr>
                          <td colspan="4" style="text-align: center; color: #94a3b8; padding: 20px;">Vault #${i} is empty. Click Auto-Type Demo above.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }
      container.innerHTML = htmlContent;
    }

    function addCredential(id) {
      const group = document.getElementById(`group_${id}`).value;
      const service = document.getElementById(`service_${id}`).value.trim();
      const user = document.getElementById(`user_${id}`).value.trim();
      const pass = document.getElementById(`pass_${id}`).value.trim();

      if(!service || !user || !pass) {
        alert(`Please fill in all credential fields for Vault #${id}!`);
        return;
      }

      playSound(950);
      const encrypted = 'mz_enc_' + btoa(pass).split('').reverse().join('');
      vaultsData[id].push({ group, service, user, encrypted, raw: pass, visible: false });

      document.getElementById(`service_${id}`).value = '';
      document.getElementById(`user_${id}`).value = '';
      document.getElementById(`pass_${id}`).value = '';

      renderVault(id);
    }

    // Continuous keystroke typing animation with unique pitch per character
    async function typeTextInstance(id, fieldType, text) {
      const el = document.getElementById(`${fieldType}_${id}`);
      el.value = "";
      for (let i = 0; i < text.length; i++) {
        el.value += text[i];
        playSound(550 + (i * 12));
        await new Promise(resolve => setTimeout(resolve, 55));
      }
    }

    async function startAutoTypeDemo(id) {
      vaultsData[id] = [];
      renderVault(id);

      const demoEntries = [
        { group: "Social Media", service: `Insta MZ #${id}`, user: `user${id}@insta.com`, pass: `Insta@${id}#2026!` },
        { group: "Banking & Finance", service: `MZ Bank #${id}`, user: `finance${id}@bank.pk`, pass: `Bank$${id}*Secure` },
        { group: "Cloud Infrastructure", service: `AWS Vault #${id}`, user: `root${id}@aws.cloud`, pass: `AWS*${id}_Key#55` }
      ];

      for (let entry of demoEntries) {
        document.getElementById(`group_${id}`).value = entry.group;
        await typeTextInstance(id, 'service', entry.service);
        await new Promise(r => setTimeout(r, 120));
        await typeTextInstance(id, 'user', entry.user);
        await new Promise(r => setTimeout(r, 120));
        await typeTextInstance(id, 'pass', entry.pass);
        await new Promise(r => setTimeout(r, 250));

        addCredential(id);
        await new Promise(r => setTimeout(r, 300));
      }

      // Auto export backup file for this instance
      const fileData = JSON.stringify(vaultsData[id], null, 2);
      const blob = new Blob([fileData], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `MZ_Vault_Instance_${id}_Backup.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function togglePassword(id, index) {
      playSound(850);
      vaultsData[id][index].visible = !vaultsData[id][index].visible;
      renderVault(id);
    }

    function generatePassword(id) {
      playSound(800);
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$*&!";
      let pass = "";
      for (let i = 0; i < 16; i++) {
        pass += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById(`pass_${id}`).value = pass;
      document.getElementById(`gen_${id}`).value = pass;
    }

    function renderVault(id) {
      const tbody = document.getElementById(`tbody_${id}`);
      document.getElementById(`count_${id}`).innerText = `${vaultsData[id].length} items secured`;

      if(vaultsData[id].length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 20px;">Vault #${id} is empty. Click Auto-Type Demo above.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      vaultsData[id].forEach((item, index) => {
        const displayPass = item.visible ? item.raw : '••••••••••••';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <span class="group-badge">${item.group}</span><br>
            <b>${item.service}</b>
          </td>
          <td>${item.user}</td>
          <td><span class="pass-masked">${displayPass}</span></td>
          <td>
            <button class="action-btn" onclick="togglePassword(${id}, ${index})">${item.visible ? 'Hide' : 'Reveal'}</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Initialize all 10 vaults on page load
    window.onload = function() {
      buildTenVaults();
    };
  </script>
</body>
</html>
